name: Проверки
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: TypeScript и запуск (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - name: Интерфейс в Chromium
        if: runner.os == 'Linux'
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.62.1
          npx --no-install playwright install --with-deps chromium
          KAGEMIYURA_VISUAL_DIR=.runtime/video-screenshots node tests/browser-smoke.mjs
      - name: Скриншоты шести режимов мозга
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-video-screenshots
          path: .runtime/video-screenshots/
          if-no-files-found: ignore
      - name: BAT, переносной Node.js и сложный путь Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/windows-launcher.ps1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-${{ matrix.os }}
          path: |
            data/logs/
            .runtime/ui-*.png
          if-no-files-found: ignore
